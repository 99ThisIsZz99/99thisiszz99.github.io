<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starfall RPG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="game-shell">
      <canvas id="game" width="320" height="180" aria-label="Game canvas"></canvas>
    </div>

    <div id="name-panel" class="hidden" aria-live="polite">
      <div class="name-card">
        <div class="title">Name your hero</div>
        <input id="player-name-input" type="text" maxlength="18" spellcheck="false" />
        <div class="controls">
          <button id="name-back" type="button">Back</button>
          <button id="name-confirm" type="button">Continue</button>
        </div>
      </div>
    </div>

    <script src="./game.js"></script>
  </body>
</html>
